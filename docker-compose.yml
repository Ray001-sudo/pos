version: '3.9'

# =============================================================================
# POS Platform — Docker Compose (development / staging)
# Production: each service should be deployed independently behind a load balancer
# All secrets should come from environment variables or a secrets manager
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL — cloud database
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       pos_platform
      POSTGRES_USER:     pos_api
      POSTGRES_PASSWORD: ${PG_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/cloud_schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pos_api -d pos_platform"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pos_internal

  # ---------------------------------------------------------------------------
  # Redis — JWT blacklist, rate limiting, session store
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD} --save 60 1 --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - pos_internal

  # ---------------------------------------------------------------------------
  # Backend API — Node.js/Express
  # ---------------------------------------------------------------------------
  api:
    build:
      context: ./backend-api
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV:                   production
      PORT:                       3000
      PG_HOST:                    postgres
      PG_PORT:                    5432
      PG_DATABASE:                pos_platform
      PG_USER:                    pos_api
      PG_PASSWORD:                ${PG_PASSWORD}
      REDIS_URL:                  redis://:${REDIS_PASSWORD}@redis:6379
      JWT_PRIVATE_KEY:            ${JWT_PRIVATE_KEY}
      JWT_PUBLIC_KEY:             ${JWT_PUBLIC_KEY}
      HANDSHAKE_HMAC_SECRET:      ${HANDSHAKE_HMAC_SECRET}
      SYNC_HMAC_SECRET:           ${SYNC_HMAC_SECRET}
      ADMIN_DASHBOARD_ORIGIN:     ${ADMIN_DASHBOARD_ORIGIN}
      LOG_LEVEL:                  info
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - pos_internal
      - pos_public

  # ---------------------------------------------------------------------------
  # Admin Dashboard — served by Nginx after Vite build
  # ---------------------------------------------------------------------------
  dashboard:
    build:
      context: ./admin-dashboard
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    networks:
      - pos_public

  # ---------------------------------------------------------------------------
  # Python AI Analytics — scheduled worker
  # ---------------------------------------------------------------------------
  ai_analytics:
    build:
      context: ./python-ai
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL:         postgresql://pos_api:${PG_PASSWORD}@postgres:5432/pos_platform
      RUN_INTERVAL_SECONDS: 3600
    networks:
      - pos_internal

# ---------------------------------------------------------------------------
# Volumes
# ---------------------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:

# ---------------------------------------------------------------------------
# Networks
# ---------------------------------------------------------------------------
networks:
  pos_internal:
    driver: bridge
    internal: true          # No direct internet access for DB / Redis
  pos_public:
    driver: bridge
